server {
    server_name dicebudget.bottle-trade.de;

    root /home/bottleadmin/projects/kniffel/frontend/out;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Universal Links (Apple) — JSON, kein Redirect
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /apple-app-site-association {
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/dicebudget.bottle-trade.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicebudget.bottle-trade.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name dicebudget.bottle-trade.de;
    return 301 https://dicebudget.bottle-trade.de$request_uri;
}
